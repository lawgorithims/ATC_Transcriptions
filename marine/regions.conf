# regions.conf — downloadable region definitions for the marine (water-ops) layer.
#
# Format:  name | label | min_lon | min_lat | max_lon | max_lat
#   name   pack filename + catalog key (lowercase, underscores)
#   label  what the pilot sees in the Downloads list
#
# The user's choice was "everything NOAA charts", meaning every region is AVAILABLE — not that any
# device holds them all. These boxes cover the whole NOAA ENC footprint; a pilot downloads the one
# or two they fly. Regions deliberately OVERLAP at their edges so a flight across a boundary does
# not meet a seam with no chart on either side.
#
# ⚠️ EVERY INDEXED CELL MUST FALL IN AT LEAST ONE REGION. build_marine_packs.py aborts otherwise.
# That guard is not theoretical: the first draft of this file missed 585 of 7,303 cells, and the
# miss was not in the ocean — it was 82 harbour cells on the Columbia/Snake, 62 on Lake Champlain
# and the NY canals, 41 on the lower Columbia, 25 in the San Francisco Delta and 22 on Lake
# Winnebago. Those are prime floatplane water. A region list that looks complete because it names
# every coast is exactly how they went missing, so DO NOT hand-edit this file without re-running
# the builder and seeing "all requested regions built cleanly".
#
# ⚠️ A CELL BEING *ASSIGNED* TO A REGION DOES NOT MEAN ITS WATER IS *COVERED*. Cells are assigned
# by bbox overlap but the data is cut per feature against the region box, so a cell can be assigned
# and still have charted area in a hole between boxes — dropped from every pack while the build
# reports success. An audit of the first version of this file found exactly that: the SE corner of
# Kodiak Island fell between southcentral_alaska (which started at 57.5 N) and southwest_alaska
# (which ended at -152.5), so 87 charted underwater rocks and 6 obstructions were in no pack at
# all. Ten band>=4 cells were affected, 8,936 approach/harbour-scale features in total.
# build_marine_packs.py now runs a COVERAGE check, not just an assignment check, and aborts when
# any band>=4 cell has footprint outside every region.
#
# ⚠️ ANTIMERIDIAN. A box is interpreted as min<max in plain degrees, so a region cannot straddle
# ±180. The western Pacific therefore gets its own POSITIVE-longitude regions. The first draft
# wrote `-172.0 | -15.0 | 147.0 | 20.5` for "Pacific islands", which passed the min<max check and
# silently meant the Americas instead of the Pacific — it matched nothing it was written for.

